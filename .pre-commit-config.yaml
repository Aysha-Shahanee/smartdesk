# Pre-commit hooks. Enable once per clone:
#
#     pip install pre-commit && pre-commit install
#
# The secret scanner is the one that matters. A credential committed once is
# committed forever as far as the history is concerned — rotating it is the only
# real remedy, and rewriting history to remove it is disruptive and usually
# incomplete. Catching it before the commit is the only cheap moment.
#
# Everything here is fast enough to run on every commit. A hook that takes ten
# seconds gets bypassed with --no-verify, which is the same as not having it.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Catches an API key pasted into a notebook cell or a .env that slipped
      # past .gitignore, by size rather than by pattern.
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # The alembic chain is the one place a bad merge is silently fatal:
      # two heads and `upgrade head` refuses to run.
      - id: check-yaml
      - id: check-toml
