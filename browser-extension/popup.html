<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDesk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
    }
    .header {
      padding: 14px 16px 10px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
      flex-shrink: 0;
    }
    .dot.off { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
    .section { padding: 12px 16px; border-bottom: 1px solid #1e1e1e; }
    .section label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .section input {
      width: 100%;
      padding: 6px 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 5px;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .section input:focus { border-color: #6366f1; }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle-label { font-size: 13px; }
    .toggle {
      position: relative;
      width: 38px; height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider:before { transform: translateX(18px); }
    .status-bar {
      padding: 8px 16px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
    .save-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 10px 16px;
      padding: 8px;
      background: #6366f1;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #4f46e5; }
  </style>
</head>
<body>

<div class="header">
  <div class="dot" id="statusDot"></div>
  <h1>SmartDesk</h1>
</div>

<div class="section">
  <label>Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://127.0.0.1:8000" />
</div>

<div class="section">
  <label>User ID</label>
  <input type="text" id="userId" placeholder="local_user" />
</div>

<div class="section">
  <div class="toggle-row">
    <span class="toggle-label">Tracking enabled</span>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked />
      <span class="slider"></span>
    </label>
  </div>
</div>

<button class="save-btn" id="saveBtn">Save</button>

<div class="status-bar" id="statusBar">Loading...</div>

<script src="popup.js"></script>
</body>
</html>
